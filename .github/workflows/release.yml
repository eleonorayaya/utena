name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -o dist/utena-daemon ./cmd/daemon
          CGO_ENABLED=0 go build -ldflags "-X main.defaultPort=3333" -o dist/utena ./cmd/tui
          tar -czf utena_linux_${{ matrix.arch }}.tar.gz -C dist utena-daemon utena
      - uses: actions/upload-artifact@v4
        with:
          name: utena_linux_${{ matrix.arch }}
          path: utena_linux_${{ matrix.arch }}.tar.gz

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$tag" utena_linux_*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Built from ${GITHUB_SHA}." \
            --latest
