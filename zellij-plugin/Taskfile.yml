
version: '3'

vars:
  TARGET: 'wasm32-wasip1'
  BIN: 'utena.wasm'
  ZELLIJ_LOG_FILE:
    sh: echo "$(find /var/folders -type f -name 'zellij.log' 2> /dev/null)"
  LOG_LOOKBACK: 100

tasks:
  build:
    label: 'build-{{.UTENA_PORT | default "default"}}'
    env:
      UTENA_PORT: '{{.UTENA_PORT | default "3333"}}'
      UTENA_DATA_DIR: '{{.UTENA_DATA_DIR | default ""}}'
      UTENA_PIPE_NAME: '{{.UTENA_PIPE_NAME | default ""}}'
      UTENA_TUI_PATH: '{{.UTENA_TUI_PATH | default "utena"}}'
    sources:
      - 'src/**/*.rs'
    cmds:
      - cargo build --target {{.TARGET}} --release

  reload:
    cmds:
      - zellij action start-or-reload-plugin file:~/.config/zellij/plugins/{{.BIN}}

  install:
    deps:
      - task: build
        vars:
          UTENA_PORT: '{{.UTENA_PORT}}'
          UTENA_DATA_DIR: '{{.UTENA_DATA_DIR}}'
          UTENA_PIPE_NAME: '{{.UTENA_PIPE_NAME}}'
          UTENA_TUI_PATH: '{{.UTENA_TUI_PATH}}'
    cmds:
      - cp "$(pwd)"/target/{{.TARGET}}/release/{{.BIN}} ~/.config/zellij/plugins/
      - task: reload

  logs_tail:
    cmds:
      - touch "${UTENA_DATA_DIR:-$HOME/.config/utena}/plugin.log"
      - tail -f "${UTENA_DATA_DIR:-$HOME/.config/utena}/plugin.log"

  logs:
    cmds:
      - tail -n {{ .LOG_LOOKBACK }} "${UTENA_DATA_DIR:-$HOME/.config/utena}/plugin.log"

  zellijlogs_tail:
    cmds:
      - tail -f {{ .ZELLIJ_LOG_FILE }}

  zellijlogs:
    cmds:
      - tail -n {{ .LOG_LOOKBACK }} {{ .ZELLIJ_LOG_FILE }}

  dev:
    deps:
      - task: build
        vars:
          UTENA_PORT: '{{.UTENA_PORT}}'
          UTENA_DATA_DIR: '{{.UTENA_DATA_DIR}}'
          UTENA_PIPE_NAME: '{{.UTENA_PIPE_NAME}}'
          UTENA_TUI_PATH: '{{.UTENA_TUI_PATH}}'
    cmds:
      - zellij action start-or-reload-plugin "file:$(pwd)/target/{{.TARGET}}/release/{{.BIN}}"

  open:
    cmds:
      - echo '{"command":"open_picker"}' | zellij pipe --name "{{.UTENA_PIPE_NAME | default "utena-commands"}}"

  fmt:
    sources:
      - 'src/**/*.rs'
    cmds:
      - cargo fmt
