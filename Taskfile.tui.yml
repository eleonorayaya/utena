version: '3'

env:
  BUBBLETEA_LOG: tui.log

vars:
  TUI_BIN: '{{.HOME}}/.local/bin/utena'

tasks:
  build:
    sources:
      - 'internal/**/*.go'
      - 'cmd/tui/main.go'
    vars:
      LDFLAGS: >-
        -X main.defaultPort={{.UTENA_PORT | default "3333"}}
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o out/tui cmd/tui/main.go
  install:
    deps:
      - build
    cmds:
      - mkdir -p {{dir .TUI_BIN}}
      - rm -f {{shellQuote .TUI_BIN}}
      - cp ./out/tui {{shellQuote .TUI_BIN}}
  run:
    deps:
      - build
    cmds:
      - ./out/tui
    interactive: true
  logs:
    cmds:
      - tail -f "$BUBBLETEA_LOG"
