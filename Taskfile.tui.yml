version: '3'

env:
  BUBBLETEA_LOG: tui.log

tasks:
  build:
    sources:
      - 'internal/**/*.go'
      - 'cmd/tui/main.go'
    cmds:
      - go build -o out/tui cmd/tui/main.go
  install:
    deps:
      - build
    cmds:
      - cp ./out/tui /usr/local/bin/utena
  run:
    env:
      UTENA_PORT: '{{.UTENA_PORT | default "3333"}}'
      UTENA_PIPE_NAME: '{{.UTENA_PIPE_NAME | default ""}}'
    deps:
      - build
    cmds:
      - ./out/tui
    interactive: true
  logs:
    cmds:
      - tail -f "$BUBBLETEA_LOG"
