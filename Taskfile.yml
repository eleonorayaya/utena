version: '3'

includes:
  daemon:
    taskfile: Taskfile.daemon.yml
  tui:
    taskfile: Taskfile.tui.yml

vars:
  DEV_PORT:
    sh: printf '%s' "$(pwd)" | cksum | awk '{print 3333 + ($1 % 667)}'
  DEV_DATA_DIR:
    sh: echo "$HOME/.config/utena/{{.DEV_PORT}}"

tasks:
  go:fmt:
    sources:
      - '**/*.go'
    cmds:
      - go fmt ./...
  go:test:
    sources:
      - '**/*.go'
    cmds:
      - go test ./...
  go:tidy:
    cmds:
      - go mod tidy
  go:lint:
    sources:
      - '**/*.go'
      - .golangci.yml
    cmds:
      - golangci-lint run ./...

  test:
    cmds:
      - task: go:test
  fmt:
    cmds:
      - task: go:fmt
  lint:
    cmds:
      - task: go:lint
  tidy:
    cmds:
      - task: go:tidy
  tmux:install:
    cmds:
      - mkdir -p ~/.config/tmux/plugins/utena-tmux
      - cp -r plugins/utena-tmux/ ~/.config/tmux/plugins/utena-tmux/

  plugin:build:
    dir: plugins/utena
    sources:
      - '**/*.go'
    cmds:
      - sh scripts/build.sh

  install:
    cmds:
      - task: daemon:install
      - task: tui:install
      - task: tmux:install

  dev:
    cmds:
      - mkdir -p "{{.DEV_DATA_DIR}}"
      - echo "Dev environment{{":"}} port={{.DEV_PORT}} data={{.DEV_DATA_DIR}}"

  dev:daemon:
    cmds:
      - task: daemon:run
        vars:
          UTENA_PORT: '{{.DEV_PORT}}'
          UTENA_DATA_DIR: '{{.DEV_DATA_DIR}}'

  dev:tui:
    cmds:
      - task: tui:build
        vars:
          UTENA_PORT: '{{.DEV_PORT}}'
