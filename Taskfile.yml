version: '3'

includes:
  daemon:
    taskfile: Taskfile.daemon.yml
  tui:
    taskfile: Taskfile.tui.yml
  extension:
    taskfile: Taskfile.extension.yml

vars:
  DEV_PORT:
    sh: printf '%s' "$(pwd)" | cksum | awk '{print 3333 + ($1 % 667)}'
  DEV_DATA_DIR:
    sh: echo "$HOME/.config/utena/{{.DEV_PORT}}"

tasks:
  go:fmt:
    sources:
      - '**/*.go'
    cmds:
      - go fmt ./...
  go:test:
    sources:
      - '**/*.go'
    cmds:
      - go test ./...
  go:tidy:
    cmds:
      - go mod tidy
  go:lint:
    sources:
      - '**/*.go'
      - .golangci.yml
    cmds:
      - golangci-lint run ./...

  test:
    cmds:
      - task: go:test
  fmt:
    cmds:
      - task: go:fmt
  lint:
    cmds:
      - task: go:lint
  tidy:
    cmds:
      - task: go:tidy
  install:
    cmds:
      - task: daemon:install
      - task: tui:install
      - task: extension:install

  release:linux:
    desc: Build the Linux release tarball in Docker (ARCH=amd64|arm64)
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
      GNU_ARCH: '{{if eq .ARCH "arm64"}}aarch64{{else}}x86-64{{end}}'
      CC: '{{if eq .ARCH "arm64"}}aarch64{{else}}x86_64{{end}}-linux-gnu-gcc'
      GO_IMAGE:
        sh: echo "golang:$(awk '/^go /{print $2}' go.mod)"
      HOST_ARCH:
        sh: docker version --format '{{"{{"}}.Server.Arch{{"}}"}}'
    cmds:
      - mkdir -p out/linux-{{.ARCH}}
      - >-
        docker run --rm --platform linux/{{.HOST_ARCH}}
        -v "$(pwd)":/src -w /src
        -v utena-gomod:/go/pkg/mod -v utena-gocache:/root/.cache/go-build
        -e GOOS=linux -e GOARCH={{.ARCH}}
        {{.GO_IMAGE}}
        sh -c 'apt-get update -qq && apt-get install -y -qq gcc-{{.GNU_ARCH}}-linux-gnu >/dev/null
        && CGO_ENABLED=1 CC={{.CC}} go build -o out/linux-{{.ARCH}}/utena-daemon ./cmd/daemon
        && CGO_ENABLED=0 go build -ldflags "-X main.defaultPort=3333" -o out/linux-{{.ARCH}}/utena ./cmd/tui'
      - tar -czf out/utena_linux_{{.ARCH}}.tar.gz -C out/linux-{{.ARCH}} utena-daemon utena

  dev:
    cmds:
      - mkdir -p "{{.DEV_DATA_DIR}}"
      - echo "Dev environment{{":"}} port={{.DEV_PORT}} data={{.DEV_DATA_DIR}}"

  dev:daemon:
    cmds:
      - task: daemon:run
        vars:
          UTENA_PORT: '{{.DEV_PORT}}'
          UTENA_DATA_DIR: '{{.DEV_DATA_DIR}}'

  dev:tui:
    cmds:
      - task: tui:build
        vars:
          UTENA_PORT: '{{.DEV_PORT}}'
