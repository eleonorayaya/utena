version: '3'

includes:
  plugin:
    taskfile: zellij-plugin/Taskfile.yml
    dir: ./zellij-plugin
  daemon:
    taskfile: Taskfile.daemon.yml
  tui:
    taskfile: Taskfile.tui.yml
  dev:
    taskfile: Taskfile.dev.yml

tasks:
  go:fmt:
    sources:
      - '**/*.go'
    cmds:
      - go fmt ./...
  go:test:
    sources:
      - '**/*.go'
    cmds:
      - go test ./...

  test:
    cmds:
      - task: go:test
  fmt:
    cmds:
      - task: go:fmt
      - task: plugin:fmt
